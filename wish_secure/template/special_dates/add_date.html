
{% extends 'base.html' %}
{% load static %}

{% block title %}
Add Special Date
{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{% static 'css/special_dates.css' %}">
{% endblock %}

{% block content %}

<div class="date-form-wrapper">

    <div class="date-form-card">

        <div class="form-header">

            <span>
                ❤️
            </span>

            <h1>
                Add a Special Date
            </h1>

            <p>
                Some days deserve to be remembered forever.
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    What should we remember?
                </label>

                <input
                    type="text"
                    name="title"
                    placeholder="Our Anniversary"
                    required>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Type
                    </label>

                    <select name="date_type">

                        <option value="Birthday">
                            🎂 Birthday
                        </option>

                        <option value="Anniversary">
                            ❤️ Anniversary
                        </option>

                        <option value="First Date">
                            🌹 First Date
                        </option>

                        <option value="First Meeting">
                            💕 First Meeting
                        </option>

                        <option value="Trip">
                            ✈️ Trip
                        </option>

                        <option value="Achievement">
                            🏆 Achievement
                        </option>

                        <option value="Other">
                            ✨ Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Icon
                </label>

                <input
                    type="text"
                    name="icon"
                    value="❤️"
                    maxlength="50">

            </div>


            <div class="form-group">

                <label>
                    Why is this date special?
                </label>

                <textarea
                    name="description"
                    rows="5"
                    placeholder="Tell us why this day matters..."></textarea>

            </div>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    name="repeat_yearly"
                    checked>

                <span>
                    Remember this every year 🔄
                </span>

            </label>


            <button
                type="submit"
                class="save-date-btn">

                Save Special Date ❤️

            </button>


            <a
                href="{% url 'date_list' %}"
                class="cancel-btn">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
