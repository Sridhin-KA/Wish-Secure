{% extends 'base.html' %}
{% load static %}

{% block title %}
Delete Promise
{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{% static 'css/promises.css' %}">
{% endblock %}

{% block content %}

<div class="delete-promise-page">

    <div class="delete-promise-card">

        <div class="delete-icon">
            💔
        </div>

        <h1>
            Delete this promise?
        </h1>

        <p>
            You're about to remove:
        </p>

        <strong>
            "{{ promise.title }}"
        </strong>

        <p class="warning">
            This action cannot be undone.
        </p>


        <form method="POST">

            {% csrf_token %}

            <div class="delete-actions">

                <a href="{% url 'view_promise' promise.id %}"
                   class="cancel-btn">

                    Keep It

                </a>

                <button type="submit"
                        class="confirm-delete-btn">

                    Delete Promise

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
