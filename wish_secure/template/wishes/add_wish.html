{% extends 'base.html' %}

{% block title %}
Add Wish
{% endblock %}

{% block content %}

<div class="wish-form-card">

    <h2>❤️ Add New Wish</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="form-group">

            <label>Wish Title</label>

            <input
                type="text"
                name="title"
                required>

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea
                name="description"
                rows="5"
                required></textarea>

        </div>

        <div class="form-group">

            <label>Category</label>

            <select name="category">

                {% for category in categories %}

                <option value="{{category.id}}">

                    {{category.name}}

                </option>

                {% endfor %}

            </select>

        </div>

        <div class="form-row">

            <div class="form-group">

                <label>Priority</label>

                <select name="priority">

                    <option>High</option>

                    <option selected>Medium</option>

                    <option>Low</option>

                </select>

            </div>

            <div class="form-group">

                <label>Visibility</label>

                <select name="visibility">

                    <option>Shared</option>

                    <option>Private</option>

                </select>

            </div>

        </div>

        <div class="form-group">

            <label>Image</label>

            <input
                type="file"
                name="image">

        </div>

        <button class="save-btn">

            ❤️ Save Wish

        </button>

    </form>

</div>

{% endblock %}
