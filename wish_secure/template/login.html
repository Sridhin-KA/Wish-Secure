{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WishSecure ❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>
<div class="bg3"></div>

<div class="login-box">

    <div class="logo">

        ❤️

    </div>

    <h1>WishSecure</h1>

    <p class="subtitle">
        Every Wish. Every Promise.
        <br>
        Safely Between Us.
    </p>

    {% if messages %}

        {% for message in messages %}

            <div class="message">

                {{message}}

            </div>

        {% endfor %}

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="input-box">

            <i class="fa-solid fa-user"></i>

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

        </div>

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
                id="password"
                type="password"
                name="password"
                placeholder="Password"
                required>

            <i
                id="eye"
                class="fa-solid fa-eye toggle-password"></i>

        </div>

        <button>

            Login ❤️

        </button>

    </form>

    <div class="quote">

        "Love is remembering the little things."

    </div>

</div>

<script src="{% static 'js/login.js' %}"></script>

</body>
</html>
